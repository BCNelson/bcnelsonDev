name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pulumi locks the stack, but queueing beats failing on the lock.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    container:
      image: node:26-bookworm
    env:
      PULUMI_VERSION: "3.268.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix infrastructure

      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      # Pulumi runs first: updating the WorkersScript resource can drop the
      # bindings wrangler owns, and the wrangler deploy below restores them.
      - name: Update infrastructure
        working-directory: infrastructure
        run: pulumi up --stack prod --yes --non-interactive
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Each workers/<name>/ is its own Worker on its own subdomain. One with a
      # package.json gets its dependencies installed and its build script run.
      - name: Deploy subdomain Workers
        run: |
          for dir in workers/*/; do
            [ -f "$dir/wrangler.json" ] || continue
            if [ -f "$dir/package.json" ]; then
              npm ci --prefix "$dir"
              npm run build --prefix "$dir" --if-present
            fi
            npx wrangler deploy --config "$dir/wrangler.json"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
